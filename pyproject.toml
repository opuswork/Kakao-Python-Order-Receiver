[project]
name = "kakao-order-receiver"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]